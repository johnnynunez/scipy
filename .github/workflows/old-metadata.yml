name: Exact legacy metadata blockers
on:
  push:
    branches: [ci/scipy-oldpin-preflight-20261012]
permissions:
  contents: read
jobs:
  metadata:
    runs-on: windows-11-arm
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Prepare exact sdists without compiling wheels
        shell: pwsh
        run: |
          $work = "$env:RUNNER_TEMP/oldpin-metadata"
          New-Item -ItemType Directory -Force "$work/evidence" | Out-Null
          $env:EVIDENCE = "$work/evidence"
          $env:PIP_CACHE_DIR = "$work/pip-cache"
          "EVIDENCE=$env:EVIDENCE" >> $env:GITHUB_ENV
          python old_metadata.py
          exit $LASTEXITCODE
      - name: Separate reference crash and native thread control
        if: always()
        shell: pwsh
        run: |
          python diagnose_current.py
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: exact-legacy-metadata-cp312-arm64
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error
          retention-days: 14
