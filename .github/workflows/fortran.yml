name: Native Fortran module runtime ABI closure
on:
  push:
    branches: [ci/fortran-closure-20261012]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: windows-11-arm
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Isolated native MSVC environment
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP/fortran-closure"
          New-Item -ItemType Directory -Force "$root/evidence", "$root/work" | Out-Null
          "WORK=$root/work" >> $env:GITHUB_ENV
          "EVIDENCE=$root/evidence" >> $env:GITHUB_ENV
          "PIP_CACHE_DIR=$root/pip-cache" >> $env:GITHUB_ENV
          python -m venv "$root/venv"
          "$root/venv/Scripts" >> $env:GITHUB_PATH
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -property installationPath
          "VSROOT=$vs" >> $env:GITHUB_ENV
          $vc = "$vs/VC/Auxiliary/Build/vcvarsall.bat"
          $lines = & cmd /c "`"$vc`" arm64 -vcvars_ver=14.44 >nul && set"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($line in $lines) {
            if ($line -match '^(PATH|INCLUDE|LIB|LIBPATH|VCToolsInstallDir|VCToolsVersion|WindowsSdkDir|WindowsSDKVersion|VSCMD_ARG_TGT_ARCH|VSCMD_ARG_HOST_ARCH)=(.*)$') { "$($matches[1])=$($matches[2])" >> $env:GITHUB_ENV }
          }
          'C:/Program Files/LLVM/bin' >> $env:GITHUB_PATH
      - name: Native compile link execution rather than version checks
        shell: pwsh
        run: |
          python -m pip install pefile==2024.8.26
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python fortran_gate.py
          exit $LASTEXITCODE
      - name: Publication allowlist and hashes
        if: always()
        shell: pwsh
        run: |
          if (Test-Path $env:EVIDENCE) {
            $bad = Get-ChildItem $env:EVIDENCE -Recurse -File | Where-Object { $_.Extension -notin '.json','.log','.txt','.xml' }
            if ($bad) { throw 'Binary publication hold violated' }
            Get-ChildItem $env:EVIDENCE -File | Get-FileHash -Algorithm SHA256 | Format-List | Out-File "$env:EVIDENCE/report-hashes.txt"
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fortran-closure-reports
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error
          retention-days: 14
