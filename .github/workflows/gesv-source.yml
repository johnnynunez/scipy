name: GESV source RED GREEN numerical regression
on:
  push:
    branches: [ci/gesv-source-regression-20261012]
permissions:
  contents: read
jobs:
  source:
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: OpenMathLib/OpenBLAS
          ref: 9bdf051b96e956f848dfcef89c23e1993b0e1b3e
          path: openblas-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Exact released compiler tools and isolated test interpreter
        shell: pwsh
        run: |
          $work = "$env:RUNNER_TEMP/gesv-source"
          New-Item -ItemType Directory -Force "$work/reports" | Out-Null
          "EVIDENCE=$work/reports" >> $env:GITHUB_ENV
          "TEST_PYTHON=$work/venv/Scripts/python.exe" >> $env:GITHUB_ENV
          $env:PIP_CACHE_DIR = "$work/pip-cache"
          python -m venv "$work/venv"
          & "$work/venv/Scripts/python.exe" -m pip install --only-binary=:all: numpy==2.5.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Invoke-WebRequest https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/LLVM-20.1.8-woa64.exe -OutFile "$work/llvm.exe"
          $proc = Start-Process "$work/llvm.exe" -ArgumentList '/S' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "LLVM install failed: $($proc.ExitCode)" }
          Invoke-WebRequest https://github.com/Kitware/CMake/releases/download/v3.29.4/cmake-3.29.4-windows-arm64.zip -OutFile "$work/cmake.zip"
          Expand-Archive "$work/cmake.zip" "$work/cmake"
          Invoke-WebRequest https://github.com/ninja-build/ninja/releases/download/v1.13.1/ninja-winarm64.zip -OutFile "$work/ninja.zip"
          Expand-Archive "$work/ninja.zip" "$work/ninja"
          "GESV_TOOLS=$work/cmake/cmake-3.29.4-windows-arm64/bin;$work/ninja;C:/Program Files/LLVM/bin" >> $env:GITHUB_ENV
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw 'Visual Studio discovery failed' }
          $vcvars = "$vs/VC/Auxiliary/Build/vcvarsarm64.bat"
          if (-not (Test-Path $vcvars)) { throw "ARM64 environment unavailable: $vcvars" }
          "VCVARS=$vcvars" >> $env:GITHUB_ENV
          $vcvars | Out-File "$work/reports/vcvars-path.txt"
      - name: Native unchanged and corrected-source regression
        shell: cmd
        run: |
          call "%VCVARS%"
          if errorlevel 1 exit /b 1
          set "PATH=%GESV_TOOLS%;%PATH%"
          "%TEST_PYTHON%" build_gesv_regression.py
          exit /b %ERRORLEVEL%
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gesv-source-regression-reports
          path: |
            ${{ env.EVIDENCE }}/*.json
            ${{ env.EVIDENCE }}/*.txt
            ${{ env.EVIDENCE }}/*.log
          if-no-files-found: error
          retention-days: 14
